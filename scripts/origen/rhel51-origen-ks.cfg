# Kickstart de rhel51-origen: VM de laboratorio que reemplaza a la VM del cliente.
# RHEL 5.1 Server x86_64 desde el DVD oficial (rhel-5.1-server-x86_64-dvd.iso),
# sin red ni actualizaciones: el kernel queda en 2.6.18-53.el5.
# IP fija: es la que conserva el ECS SAP final en Huawei Cloud.
# Placeholders: <HASH_MD5_GENERADO_LOCALMENTE> (RHEL 5.1 no soporta SHA-512 en shadow)
#               <LLAVE_PUBLICA_RSA_LAB>       (OpenSSH 4.3 no soporta ed25519)
install
cdrom
key --skip
text
lang es_ES.UTF-8
keyboard la-latin1
network --device eth0 --bootproto static --ip 192.168.63.50 --netmask 255.255.255.0 --gateway 192.168.63.2 --nameserver 192.168.63.2 --hostname rhel51-origen
rootpw --iscrypted <HASH_MD5_GENERADO_LOCALMENTE>
authconfig --enableshadow --enablemd5
firewall --disabled
selinux --disabled
timezone America/Lima
skipx
bootloader --location=mbr --driveorder=sda
zerombr yes
clearpart --all --initlabel --drives=sda,sdb

# Disco de sistema (sda): /boot + LVM por defecto de RHEL 5
part /boot --fstype ext3 --size=100 --ondisk=sda
part pv.01 --size=1 --grow --ondisk=sda
volgroup VolGroup00 pv.01
logvol swap --fstype swap --name=LogVol01 --vgname=VolGroup00 --size=1024
logvol / --fstype ext3 --name=LogVol00 --vgname=VolGroup00 --size=1024 --grow

# Disco de datos (sdb): LVM aparte, simula el volumen de SAP
part pv.02 --size=1 --grow --ondisk=sdb
volgroup VolGroupDatos pv.02
logvol /datos --fstype ext3 --name=LogVolDatos --vgname=VolGroupDatos --size=1 --grow

reboot

%packages
@core
@base
openssh-server
openssh-clients
lvm2
make
patch

%post
mkdir -p /root/.ssh && chmod 700 /root/.ssh
echo "<LLAVE_PUBLICA_RSA_LAB>" > /root/.ssh/authorized_keys
chmod 600 /root/.ssh/authorized_keys
sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin without-password/' /etc/ssh/sshd_config
# Sin actualizaciones ni registro en RHN: el sistema debe quedar congelado en 5.1
chkconfig yum-updatesd off 2>/dev/null
chkconfig rhnsd off 2>/dev/null
