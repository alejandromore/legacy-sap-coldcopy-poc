# Kickstart aux-copia (Rocky Linux 9) - legacy-sap-coldcopy-poc
text
cdrom
repo --name=BaseOS-net --mirrorlist=https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=BaseOS-9
repo --name=AppStream --mirrorlist=https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=AppStream-9
lang es_ES.UTF-8
keyboard --vckeymap=latam --xlayouts=latam
timezone America/Lima --utc
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=aux-copia
firewall --enabled --service=ssh
selinux --enforcing
rootpw --lock
user --name=lab --groups=wheel --iscrypted --password='<HASH_SHA512_GENERADO_LOCALMENTE>'
sshkey --username=lab "<LLAVE_PUBLICA_LAB>"
ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel --drives=sda
bootloader --location=mbr --boot-drive=sda
autopart --type=plain --nohome
reboot --eject

%packages
@^minimal-environment
open-vm-tools
lvm2
tar
rsync
%end

%post --log=/root/ks-post.log
dnf -y install zstd || echo "AVISO: no se pudo instalar zstd"
echo 'lab ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/lab && chmod 440 /etc/sudoers.d/lab
# No activar automaticamente LVM de discos conectados (discos de origen)
sed -i 's/^\(\s*\)# *event_activation = 1/\1event_activation = 0/' /etc/lvm/lvm.conf
grep -q '^\s*event_activation = 0' /etc/lvm/lvm.conf || sed -i '/^global {/a\	event_activation = 0' /etc/lvm/lvm.conf
sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
%end
